name: Deploy to GitHub Pages

# The site is static (output: 'static'), so Pages serves the build output
# directly and no server runtime is involved. The base is derived from the repo
# name, which is what a project site is mounted under, so the same workflow
# works for any repo name and nothing hardcodes /markdown-portfolio in source.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm run check

      # A user site (<owner>.github.io) is served from the domain root; every
      # other repo name is a project site served from /<repo>/. Same build, one
      # switch — nothing in src/ knows which case it is.
      - name: Build
        env:
          SITE_BASE: ${{ endsWith(github.event.repository.name, '.github.io') && '/' || format('/{0}', github.event.repository.name) }}
          SITE_URL: https://${{ github.repository_owner }}.github.io
        run: pnpm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
